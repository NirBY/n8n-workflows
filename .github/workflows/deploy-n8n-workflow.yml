name: Deploy n8n workflow to staging

on:
  push:
    branches:
      - main
    paths:
      - "staging/*.json"

  workflow_dispatch:
    inputs:
      workflow_path:
        description: "Workflow JSON path under staging/"
        required: false
        default: "staging/personal-productivity-safe.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger n8n staging deploy
        env:
          N8N_DEPLOY_WEBHOOK_URL: ${{ secrets.N8N_DEPLOY_WEBHOOK_URL }}
          N8N_DEPLOY_WEBHOOK_SECRET: ${{ secrets.N8N_DEPLOY_WEBHOOK_SECRET }}
          WORKFLOW_PATH: ${{ github.event.inputs.workflow_path || 'staging/personal-productivity-safe.json' }}
        run: |
          curl -fsS -X POST "$N8N_DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-N8N-Deploy-Secret: $N8N_DEPLOY_WEBHOOK_SECRET" \
            -d "{
              \"repository\": { \"full_name\": \"${{ github.repository }}\" },
              \"ref\": \"refs/heads/${{ github.ref_name }}\",
              \"workflow_path\": \"$WORKFLOW_PATH\"
            }"
