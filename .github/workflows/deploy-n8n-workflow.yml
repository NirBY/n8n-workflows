name: Deploy n8n workflow to staging

on:
  push:
    branches:
      - main
    paths:
      - "staging/*.json"

  workflow_dispatch:
    inputs:
      workflow_path:
        description: "Workflow JSON path under staging/, or all"
        required: false
        default: "all"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger n8n staging deploys
        env:
          N8N_DEPLOY_WEBHOOK_URL: ${{ secrets.N8N_DEPLOY_WEBHOOK_URL }}
          N8N_DEPLOY_WEBHOOK_SECRET: ${{ secrets.N8N_DEPLOY_WEBHOOK_SECRET }}
          WORKFLOW_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_path || 'changed' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_PATH" = "all" ]; then
            mapfile -t workflow_paths < <(find staging -maxdepth 1 -type f -name '*.json' | sort)
          elif [ "$WORKFLOW_PATH" = "changed" ]; then
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              mapfile -t workflow_paths < <(find staging -maxdepth 1 -type f -name '*.json' | sort)
            else
              mapfile -t workflow_paths < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'staging/*.json' | sort)
            fi
          else
            workflow_paths=("$WORKFLOW_PATH")
          fi

          deployed=0
          for workflow_path in "${workflow_paths[@]}"; do
            workflow_path="${workflow_path#./}"

            case "$workflow_path" in
              staging/*.json)
                ;;
              *)
                echo "Refusing non-staging workflow path: $workflow_path" >&2
                exit 1
                ;;
            esac

            echo "Deploying $workflow_path"
            deployed=$((deployed + 1))
            curl -fsS -X POST "$N8N_DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-N8N-Deploy-Secret: $N8N_DEPLOY_WEBHOOK_SECRET" \
              -d "{
                \"repository\": { \"full_name\": \"${{ github.repository }}\" },
                \"ref\": \"refs/heads/${{ github.ref_name }}\",
                \"workflow_path\": \"$workflow_path\"
              }"
          done

          if [ "$deployed" -eq 0 ]; then
            echo "No deployable staging workflow changes found."
          fi
